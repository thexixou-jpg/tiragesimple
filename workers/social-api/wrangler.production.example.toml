# Copy to wrangler.production.toml locally. Never commit the copy: it contains
# your Cloudflare database ID and deployment-specific routes.
name = "tiragesimple-social-api"
main = "src/index.ts"
compatibility_date = "2026-08-23"
workers_dev = false

[vars]
YOUTUBE_ENABLED = "true"
BLUESKY_ENABLED = "true"
MASTODON_ENABLED = "true"
MASTODON_ALLOWED_HOSTS = "mastodon.social,mastodon.online,mastodon.world,mstdn.social,piaille.fr,framapiaf.org,mamot.fr,mastodon.art,fosstodon.org,infosec.exchange,hachyderm.io,techhub.social,toot.community"
LEMMY_ENABLED = "true"
LEMMY_ALLOWED_HOSTS = "lemmy.world,lemmy.ml,jlai.lu,feddit.org"
GITHUB_ENABLED = "true"
ALLOWED_ORIGIN = "https://tiragesimple.fr"
PUBLIC_SITE_URL = "https://tiragesimple.fr"
RETENTION_DAYS = "30"
MAX_PARTICIPANTS = "10000"

[[d1_databases]]
binding = "DB"
database_name = "tiragesimple-social"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[queues.producers]]
binding = "SOCIAL_IMPORT_QUEUE"
queue = "tiragesimple-social-imports"

[[queues.consumers]]
queue = "tiragesimple-social-imports"
max_batch_size = 1
max_retries = 3

[triggers]
crons = ["0 4 * * *"]
